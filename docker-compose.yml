version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: franciscan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-FranciscanRoot@2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-FransiscanLive}
      MYSQL_USER: ${MYSQL_USER:-franciscan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-FranciscanPass@2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
      - ./mysql-backups:/backups
    networks:
      - franciscan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-FranciscanRoot@2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Node.js Backend API
  backend:
    build:
      context: ./Fransiscan-Nodejs-BE
      dockerfile: Dockerfile
    container_name: franciscan-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_SERVER=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-FransiscanLive}
      - DB_USER=${MYSQL_USER:-franciscan_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-FranciscanPass@2024}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:3001
      - LOG_LEVEL=info
      - BCRYPT_ROUNDS=12
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    volumes:
      - ./Fransiscan-Nodejs-BE/logs:/app/logs
      - ./Fransiscan-Nodejs-BE/public:/app/public
    networks:
      - franciscan-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./francisicon-react-front-end
      dockerfile: Dockerfile
    container_name: franciscan-frontend
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    networks:
      - franciscan-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  franciscan-network:
    driver: bridge

